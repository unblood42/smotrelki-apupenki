    <main>
      <div class="feed-container">
        <div class="feed-filters">
          <div class="feed-filter-tabs">
            <button class="feed-filter-tab active" data-filter="all">
              Все
            </button>
            <button class="feed-filter-tab" data-filter="mine">
              Только мои
            </button>
          </div>
          <div class="feed-author-filter">
            <label for="feed-author-select" class="feed-author-label">
              <i class="fas fa-user"></i> Автор:
            </label>
            <select id="feed-author-select">
              <option value="">Все авторы</option>
            </select>
          </div>
        </div>

        <div class="feed-list" id="feed-list">
          <p class="feed-loading">Загрузка...</p>
        </div>
      </div>
    </main>
