    <main>
      <div class="music-container">
        <h2>Наш плейлист на Яндекс.Музыке</h2>

        <div class="music-iframe-wrapper">
          <iframe
            id="yandex-music-iframe"
            frameborder="0"
            allow="clipboard-write"
            referrerpolicy="no-referrer-when-downgrade"
            style="border: none; width: 100%; height: 556px"
            src="https://music.yandex.ru/iframe/#playlist/artemgreenyaev/1013"
          >
            Слушайте
            <a
              href="https://music.yandex.ru/playlists/30e63bdf-8dc2-59eb-b9bc-a2fabfc922b4?utm_source=web&utm_medium=copy_link"
              >Имбо</a
            >
            —
            <a href="https://music.yandex.ru/users/artemgreenyaev"
              >Артём Гриняев</a
            >
            на Яндекс Музыке
          </iframe>
        </div>

        <div class="music-fallback" id="music-fallback" style="display: none">
          <div class="music-fallback-icon">
            <i class="fas fa-headphones"></i>
          </div>
          <div class="music-fallback-text">
            <strong>Плейлист не загружается</strong>
            <span>Возможно, блокировщик, VPN или проблема с сетью.</span>
          </div>
          <a
            href="https://music.yandex.ru/playlists/30e63bdf-8dc2-59eb-b9bc-a2fabfc922b4"
            target="_blank"
            rel="noopener"
            class="filter-btn music-fallback-btn"
          >
            Открыть в Яндекс.Музыке <i class="fas fa-external-link-alt"></i>
          </a>
        </div>

        <p class="music-footer">
          <i class="fas fa-headphones"></i> Имбо музыка для лег
          <a
            href="https://music.yandex.ru/playlists/30e63bdf-8dc2-59eb-b9bc-a2fabfc922b4"
            target="_blank"
            rel="noopener"
            class="music-footer-link"
          >
            · открыть в Яндекс.Музыке
          </a>
        </p>
      </div>

    <script>
      // Если iframe не загрузился за 5 секунд — показываем fallback
      (function () {
        const iframe = document.getElementById("yandex-music-iframe");
        const fallback = document.getElementById("music-fallback");
        if (!iframe || !fallback) return;

        let loaded = false;
        const timer = setTimeout(() => {
          if (!loaded) {
            fallback.style.display = "flex";
          }
        }, 5000);

        iframe.addEventListener("load", () => {
          loaded = true;
          clearTimeout(timer);
        });
      })();
    </script>
