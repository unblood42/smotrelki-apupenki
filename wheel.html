  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Колесо фортуны</title>

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

  <body>
    <header class="header">
      <h1>🍿 Апупенные смотрелки</h1>
      <nav>
        <a href="index.html">Главная</a>
        <a href="music.html">Плейлист</a>
        <a href="wheel.html" class="active">Колесо</a>
        <a href="marathons.html">Марафоны</a>
        <span id="user-email" style="color: white; margin-right: 10px"></span>
        <button id="auth-button" class="filter-btn">Войти</button>
      </nav>
    </header>

    <main>
      <!-- Фильтры (аналогично главной, но с добавлением фильтра по длительности) -->
      <div class="filters">
        <!-- Только нужные фильтры: годы, длительность, жанры и кнопка сброса -->
        <div
          class="filter-row row-middle"
          style="justify-content: space-between; flex-wrap: wrap"
        >
          <div class="year-filter">
            <input
              type="number"
              id="year-from"
              class="year-input"
              placeholder="Год от"
              min="1900"
              max="2030"
            />
            <input
              type="number"
              id="year-to"
              class="year-input"
              placeholder="Год до"
              min="1900"
              max="2030"
            />
            <button class="filter-btn apply-btn" id="apply-year-filter">
              <i class="fas fa-check"></i> OK
            </button>
          </div>
          <div class="duration-filter">
            <input
              type="number"
              id="duration-min"
              class="year-input duration-input"
              placeholder="Мин от"
              min="0"
              step="5"
            />
            <input
              type="number"
              id="duration-max"
              class="year-input duration-input"
              placeholder="Мин до"
              min="0"
              step="5"
            />
            <button class="filter-btn apply-btn" id="apply-duration-filter">
              <i class="fas fa-clock"></i> OK
            </button>
          </div>
          <button class="filter-btn reset-btn" id="reset-filters">
            <i class="fas fa-undo-alt"></i> Сбросить фильтры
          </button>
        </div>

        <!-- Жанры остаются -->
        <div class="filter-row row-bottom">
          <div class="genre-filter">
            <button class="filter-btn genre-filter-btn">
              Жанры <i class="fa-solid fa-angle-down"></i>
            </button>
            <div class="genre-dropdown hidden">
              <input
                type="text"
                class="genre-search"
                placeholder="Поиск жанра..."
              />
              <div class="genre-list"></div>
              <button class="genre-clear filter-btn">Сбросить жанры</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Основная область колеса -->
      <div class="wheel-container">
        <!-- Левая часть: колесо и доступные фильмы -->
        <div class="wheel-left">
          <div class="wheel-display">
            <h2>Случайный фильм</h2>

            <div class="wheel-ring-container" id="wheel-ring-container">
              <div class="wheel-ring" id="wheel-ring"></div>
              <div class="wheel-pointer">
                <div class="wheel-pointer-triangle"></div>
              </div>
              <div class="wheel-ring-center">
                <i class="fas fa-film"></i>
              </div>
              <div class="wheel-ring-loading" id="wheel-ring-loading">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem"></i>
                <span>Загрузка фильмов...</span>
              </div>
            </div>

            <div class="wheel-result" id="wheel-result"></div>

            <button class="filter-btn spin-btn" id="spin-button" disabled>
              <i class="fas fa-spinner fa-spin"></i> Загрузка...
            </button>

            <div class="spin-duration-settings">
              <label for="spin-duration-min" class="spin-duration-label">
                <i class="fas fa-hourglass-half"></i>
                Длительность:
              </label>
              <input
                type="number"
                id="spin-duration-min"
                class="spin-duration-input"
                min="0.5"
                max="15"
                step="0.5"
                value="2"
              />
              <span class="spin-duration-sep">—</span>
              <input
                type="number"
                id="spin-duration-max"
                class="spin-duration-input"
                min="0.5"
                max="15"
                step="0.5"
                value="2"
              />
              <span class="spin-duration-unit">сек</span>
            </div>
          </div>

          <!-- Сетка доступных фильмов (с кнопками исключения) -->
          <div class="available-films">
            <h3>Доступные фильмы (нажмите на 🚫, чтобы исключить)</h3>
            <div class="films-grid" id="films-container"></div>
          </div>
        </div>

        <!-- Правая панель: исключённые фильмы -->
        <div class="excluded-panel">
          <h3>Исключённые из колеса</h3>
          <div class="excluded-list" id="excluded-list">
            <!-- Сюда будут добавляться карточки исключённых фильмов -->
          </div>
          <p class="excluded-info">Кликните на фильм, чтобы вернуть</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Сделано с ❤️ для друзей</p>
    </footer>
